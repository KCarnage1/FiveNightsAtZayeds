<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050308"><title>Five Nights at Zayed's 2</title><meta name="description" content="A fan horror game. Survive six nights at the new Zayed's with a flashlight, a mask, the cameras and a music box. Play alone or with a friend, in your browser."><meta property="og:title" content="Five Nights at Zayed's 2"><meta property="og:description" content="Survive six nights with a flashlight, a mask, the cameras and a music box. Plays in your browser, alone or with a friend."><meta property="og:type" content="website"><meta name="color-scheme" content="dark"><link rel="icon" type="image/svg+xml" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body>
<canvas id="gl"></canvas>
<div id="staticOv" class="fx"></div><div id="vignette"></div><div id="flashOv"></div>
<div id="hud" hidden>
  <div class="clock"><b id="hClock">12 AM</b><span id="hNight">Night 1</span><i id="hBar" aria-hidden="true"><u></u></i></div>
  <div class="meters"><div class="m"><label>Flashlight <em id="fPct"></em></label><i><u id="mFlash"></u></i></div><div class="m" id="boxM"><label>Music box <em id="bPct"></em></label><i><u id="mBox"></u></i></div><div id="danger" hidden><svg viewBox="0 0 20 18" aria-hidden="true"><path d="M10 1 19 17H1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 7v5M10 14v1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span></span></div><div id="tut" hidden></div></div>
  <div id="caps" aria-live="polite"></div>
  <button id="bPause" class="pausebtn" aria-label="Pause">❚❚</button>
  <div id="actBar">
  <button id="bSealL" class="act seal" aria-label="Seal the left vent">SEAL L<small>Q</small></button>
  <button id="bMask" class="act" aria-label="Mask">MASK<small>hold Shift</small></button>
  <button id="bFlash" class="act" aria-label="Flashlight">LIGHT<small>hold F</small></button>
  <button id="bCam" class="act" aria-label="Cameras">CAMERAS<small>C</small></button>
  <button id="bSealR" class="act seal" aria-label="Seal the right vent">SEAL R<small>E</small></button>
  </div>
  <div id="hint"></div>
</div>
<div id="call" hidden><b class="who"></b><p class="txt"></p><button id="callSkip">Mute call</button></div>
<div id="camUI" hidden>
  <div class="camname" id="camName"></div><div id="camList"></div><canvas id="mini" width="220" height="200"></canvas>
  <button id="bWind" hidden>Hold to wind the music box</button>
</div>
<div id="maskOv" aria-hidden="true"><svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 0h100v60H0z M50 6C34 6 22 14 19 28c-2 11 4 22 14 28 6 3 11 4 17 4s11-1 17-4c10-6 16-17 14-28C78 14 66 6 50 6z" fill="#06040a" fill-rule="evenodd"/><path d="M50 6C34 6 22 14 19 28c-2 11 4 22 14 28 6 3 11 4 17 4s11-1 17-4c10-6 16-17 14-28C78 14 66 6 50 6z" fill="none" stroke="#c99556" stroke-width=".8"/></svg></div>
<div id="screen" class="screen" hidden></div>
<div id="modal" class="screen modal" hidden></div>
<div id="scareBar" hidden></div>
<div id="fps" hidden></div><div id="toast" hidden></div>
<div id="loading" class="screen">
  <div class="ld">
    <div class="eyes"><i></i><i></i></div>
    <h1>Five Nights<br>at Zayed's 2</h1>
    <div class="bar"><u id="ldBar"></u></div>
    <p id="ldMsg">Waking the animatronics…</p>
    <p id="ldTip" class="tip"></p>
    <button id="ldGo" class="big" hidden>Click to start</button>
    <p class="warn" id="ldWarn" hidden></p>
  </div>
</div>
<script src="game.bundle.js" defer></script></body></html>
