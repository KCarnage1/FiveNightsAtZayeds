<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Five Nights at Zayed's 2</title><link rel="stylesheet" href="styles.css"></head><body>
<canvas id="gl"></canvas>
<div id="staticOv" class="fx"></div>
<div id="hud" hidden>
  <div class="clock"><b id="hClock">12 AM</b><span id="hNight">Night 1</span></div>
  <div class="meters"><div class="m"><label>Flashlight</label><i><u id="mFlash"></u></i></div><div class="m" id="boxM"><label>Music box</label><i><u id="mBox"></u></i></div></div>
  <button id="bMask" class="act" aria-label="Mask">MASK<small>M</small></button>
  <button id="bFlash" class="act" aria-label="Flashlight">LIGHT<small>F</small></button>
  <button id="bCam" class="act" aria-label="Cameras">CAMERAS<small>C</small></button>
  <div id="hint"></div>
</div>
<div id="camUI" hidden>
  <div class="camname" id="camName"></div><div id="camList"></div><canvas id="mini" width="220" height="200"></canvas>
  <button id="bWind" hidden>HOLD TO WIND THE MUSIC BOX</button>
</div>
<div id="maskOv" aria-hidden="true"><svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 0h100v60H0z M50 6C34 6 22 14 19 28c-2 11 4 22 14 28 6 3 11 4 17 4s11-1 17-4c10-6 16-17 14-28C78 14 66 6 50 6z" fill="#06040a" fill-rule="evenodd"/><path d="M50 6C34 6 22 14 19 28c-2 11 4 22 14 28 6 3 11 4 17 4s11-1 17-4c10-6 16-17 14-28C78 14 66 6 50 6z" fill="none" stroke="#c99556" stroke-width=".8"/></svg></div>
<div id="screen" class="screen"></div>
<div id="scareBar" hidden></div>
<script src="game.bundle.js" defer></script></body></html>
