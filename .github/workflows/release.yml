name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (created on the commit this runs on if it does not exist), e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  ELECTRON_VERSION: 33.2.0

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp the release version into the app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Package Windows build
        run: >
          npx --yes @electron/packager . FiveNightsAtZayeds
          --platform=win32 --arch=x64 --asar
          --electron-version=$ELECTRON_VERSION
          --ignore="^/verity-song-dub \(1\)\.mp4$"
          --ignore="^/\.github"
          --ignore="^/rust"
          --ignore="^/tests"
          --ignore="^/scripts"
          --ignore="^/fnaz2"
          --out=dist

      - name: Zip
        run: cd dist && zip -qr FiveNightsAtZayeds-win32-x64.zip FiveNightsAtZayeds-win32-x64

      # the in-game updater downloads this file instead of the whole zip
      - name: Copy app.asar
        run: cp dist/FiveNightsAtZayeds-win32-x64/resources/app.asar dist/app.asar

      # says which Electron this release was built with, so the in-game updater knows when the whole build must be replaced
      - name: Note the Electron version
        run: echo "$ELECTRON_VERSION" > dist/electron.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/FiveNightsAtZayeds-win32-x64.zip dist/app.asar dist/electron.txt --clobber
          else
            gh release create "$TAG" dist/FiveNightsAtZayeds-win32-x64.zip dist/app.asar dist/electron.txt \
              --target "$GITHUB_SHA" --title "Five Nights at Zayed's ${TAG#v}" --generate-notes
          fi

  macos:
    needs: windows # the Windows job creates the release; this one adds its zips to it
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stamp the release version into the app
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Package macOS build
        run: >
          npx --yes @electron/packager . FiveNightsAtZayeds
          --platform=darwin --arch=${{ matrix.arch }} --asar
          --electron-version=$ELECTRON_VERSION
          --ignore="^/verity-song-dub \(1\)\.mp4$"
          --ignore="^/\.github"
          --ignore="^/rust"
          --ignore="^/tests"
          --ignore="^/scripts"
          --ignore="^/fnaz2"
          --out=dist

      # Apple Silicon refuses to start an app whose signature is missing or broken, so sign it ad hoc.
      # This is not notarised: the first launch needs right-click, Open (see README).
      - name: Ad-hoc sign
        run: codesign --force --deep --sign - dist/FiveNightsAtZayeds-darwin-${{ matrix.arch }}/FiveNightsAtZayeds.app

      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/FiveNightsAtZayeds-darwin-${{ matrix.arch }}/FiveNightsAtZayeds.app dist/FiveNightsAtZayeds-mac-${{ matrix.arch }}.zip

      - name: Add to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/FiveNightsAtZayeds-mac-${{ matrix.arch }}.zip --clobber
